# The fixture suite in tests/ needs a XenForo installation, so it runs locally only (see README.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: composer validate --strict

      # php -l exits successfully on deprecations, so its output is checked for them.
      - run: |
          find src tests bootstrap.php -name '*.php' -print0 \
            | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=stderr -d log_errors=0 -l 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"
          if grep -qE '^(PHP )?Deprecated:' "$RUNNER_TEMP/lint.log"; then
            echo "::error::php -l reported deprecations"
            exit 1
          fi

  cs:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: composer cs

  phpstan:
    name: PHPStan (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dependencies: highest
          # The lowest versions composer.json allows, on the lowest PHP it supports.
          - php: '8.1'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer analyse -- --no-progress --error-format=github
